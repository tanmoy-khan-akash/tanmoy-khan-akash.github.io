<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A search algorithm to solve the 4x4 tile-sliding puzzle">
    <meta name="color-scheme" content="dark light">
    <title>15-puzzle solver</title>

    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./js/main.js"></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <a href="https://tanmoy-khan-akash.github.io/">Home</a>
      </div>
      <div class="nav-right">
        <a href="https://tanmoy-khan-akash.github.io/#works">Projects</a>
        <a href="https://tanmoy-khan-akash.github.io/">About</a>
      </div>
    </nav>
    <div class="container">
      <div class="header">
        <h1 class="title">15-puzzle solver</h1>
        <div class="theme-switcher">
          <div class="theme-indicator"></div>
          <button id="theme-toggle" aria-label="Toggle theme">
            <svg class="sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.834 6.166a.75.75 0 00-1.06 1.06l-1.591-1.59a.75.75 0 001.06-1.061l1.591 1.59zM2.25 12a.75.75 0 01.75-.75h2.25a.75.75 0 010 1.5H3a.75.75 0 01-.75-.75zM6.166 17.834a.75.75 0 001.06 1.06l1.591-1.59a.75.75 0 00-1.06-1.06l-1.591 1.59z" />
            </svg>
            <svg class="moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-3.864 2.09-7.171 5.197-9.002a.75.75 0 01.819.162z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

      <main id="app">
        <div class="game-board app__component">
          <div class="tile__container"><div data-num="1" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="2" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="3" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="4" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="5" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="6" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="7" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="8" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="9" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="10" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="11" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="12" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="13" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="14" class="tile appear"></div></div>
          <div class="tile__container"><div data-num="15" class="tile appear"></div></div>
          <div class="tile__container"></div>
        </div>

        <div class="game-controls app__component">
          <section>
            <h3 class="game-controls__title">Edit board</h3>

            <div class="game-controls__btn-set">
              <button class="game-controls__btn" id="board-reset">Reset</button>
              <button class="game-controls__btn" id="board-shuffle">Shuffle</button>
              <button class="game-controls__btn" id="board-manual">Manual</button>
            </div>
          </section>

          <section>
            <h3 class="game-controls__title">Solver</h3>

            <div class="game-controls__btn-set">
              <button class="game-controls__btn" id="board-solve">Loading...</button>
            </div>
          </section>

          <section>
            <h3 class="game-controls__title">Stats</h3>
            <ul class="game-controls__stats">
              <li>Solution length: <span id="stats-len">0</span></li>
              <li>Search time: <span id="stats-time">0</span>ms</li>
            </ul>
          </section>
        </div>
      </main>
    </div>


    <div id="github-modal" class="github-modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-content">
        <button class="close-modal" id="close-github-modal" aria-label="Close follow prompt">×</button>
        <h3>Follow along on GitHub</h3>
        <p>Like the run? Smash follow to keep up with fresh AI experiments and game dev shenanigans.</p>
        <a class="modal-link" href="https://github.com/tanmoy-khan-akash" target="_blank" rel="noopener noreferrer">Explore more Projects →</a>
      </div>
    </div>
    <div id="github-modal-overlay" class="github-modal-overlay" aria-hidden="true"></div>


  </body>
</html>
